# Cabeçalhos de segurança aplicados pelo Netlify em todas as páginas.
# O build (comando e pasta) continua configurado no painel do Netlify.

[[headers]]
  for = "/*"
  [headers.values]
    # Só carrega o que vem do próprio site. Se um dia o formulário usar um serviço externo
    # (NEXT_PUBLIC_FORM_ENDPOINT), acrescente o endereço dele em connect-src.
    # 'unsafe-inline' é necessário para os scripts que o Next escreve dentro do HTML.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Impede que outros sites usem os vídeos e a trilha direto daqui (gastaria os créditos do Netlify).
# A capa usada nas prévias de link fica em /media/hero e continua liberada.
[[headers]]
  for = "/media/works/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/media/audio/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
